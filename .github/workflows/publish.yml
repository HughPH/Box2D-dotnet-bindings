name: Build & publish Box2D‑CSharp bindings

on:
    push:
        branches: [ "**" ]
    workflow_dispatch:

env:
    BOX2D_REPO: erincatto/box2d
    NUGET_FEED: https://api.nuget.org/v3/index.json

jobs:
    detect-tag:
        name: Detect Box2D tag & compute version
        runs-on: ubuntu-latest
        env:
            GH_TOKEN: ${{ github.token }}
        permissions:
            contents: read
        outputs:
            box2d_ref: ${{ steps.ref.outputs.ref }}
            pkg_ver: ${{ steps.version.outputs.value }}
        steps:
            -   id: ref
                name: "Fetch latest Box2D tag or commit"
                run: |
                    tag=$(gh api /repos/$BOX2D_REPO/releases/latest --jq .tag_name)
                    echo "Using Box2D ref: $tag"
                    echo "ref=$tag" >> "$GITHUB_OUTPUT"

            -   id: version
                name: "Compute managed package version string"
                run: |
                    ts=$(date -u '+%Y.%m.%d.%H%M')
                    branch="${GITHUB_REF_NAME##*/}"
                    if [ "$branch" = "main" ] || [ "$branch" = "master" ]; then
                      version="$ts"
                    else
                      safe_branch=$(echo "$branch" | tr '/ "' '--')
                      version="$ts-$safe_branch"
                    fi
                    echo "value=$version" >> "$GITHUB_OUTPUT"
                    echo "Computed version: $version"

    build-box2d-linux-x64:
        name: Build / retrieve Box2D native libs (Build & Test)
        needs: detect-tag
        strategy:
            matrix:
                include:
                    # Linux x64
                    -   target: linux-x64
                        runs_on: ubuntu-latest
                        cmake_flags: >
                            -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DBOX2D_SAMPLES=OFF -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=bin -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin -DCMAKE_C_FLAGS="-march=native -Wno-error=maybe-uninitialized"
        runs-on: ${{ matrix.runs_on }}
        
        concurrency:
            group: box2d-${{ matrix.target }}-${{ needs.detect-tag.outputs.box2d_ref }}
            cancel-in-progress: false

        steps:
            -   id: purge
                name: Move previous run to /dev/null for safekeeping
                run: |
                    rm -rf ./* 
            
            -   id: cache
                name: Restore native build cache
                uses: actions/cache@v4
                with:
                    path: box2d-build
                    key: ${{ matrix.target }}-${{ needs.detect-tag.outputs.box2d_ref }}
                    restore-keys: |
                        ${{ matrix.target }}-${{ needs.detect-tag.outputs.box2d_ref }}

            -   name: "Clone Box2D ${{ needs.detect-tag.outputs.box2d_ref }}"
                if: steps.cache.outputs.cache-hit != 'true'
                run: |
                    git clone https://github.com/${{ env.BOX2D_REPO }} box2d-src
                    cd box2d-src
                    git checkout ${{ needs.detect-tag.outputs.box2d_ref }}
                    
            -   name: "Configure & compile Box2D"
                if: steps.cache.outputs.cache-hit != 'true'
                run: |
                    cmake -S box2d-src -B box2d-build ${{ matrix.cmake_flags }}
                    cmake --build box2d-build --config Release --parallel

            -   name: Prepare artefact directory
                shell: bash
                run: |
                    mkdir -p artefact/
                    if [ -f box2d-build/bin/libbox2d.so ]; then
                      cp box2d-build/bin/libbox2d.so artefact/
                    fi
                    if [ -f box2d-build/bin/libbox2d.dylib ]; then
                      cp box2d-build/bin/libbox2d.dylib artefact/
                    fi
                    if [ -f box2d-build/bin/libbox2d.dll ]; then
                      cp box2d-build/bin/libbox2d.dll artefact/
                    fi

            -   name: "Fail if artefact directory is empty"
                shell: bash
                run: |
                    if [ -z "$(ls -A artefact/)" ]; then
                      echo "Artefact directory is empty, aborting."
                      tree box2d-build/bin
                      exit 1
                    fi

            -   name: Upload artefacts
                uses: actions/upload-artifact@v4
                with:
                    name: ${{ matrix.target }}
                    path: artefact/
                    retention-days: 7
                    if-no-files-found: 'error'

    build-box2d-main:
        name: Build / retrieve Box2D native libs (Dist)
        needs: detect-tag
        if: ${{ github.ref == 'refs/heads/main' ||
            startsWith(github.ref_name, 'public/') }}
        strategy:
            matrix:
                include:
                    # Linux x86
                    -   target: linux-x86
                        runs_on: ubuntu-latest
                        apt_packages: gcc-multilib g++-multilib
                        cmake_flags: >
                            -DBUILD_SHARED_LIBS=ON
                            -DCMAKE_BUILD_TYPE=Release
                            -DBOX2D_SAMPLES=OFF
                            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=bin
                            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin
                            -DCMAKE_C_FLAGS="-m32 -msse2 -mstackrealign -march=i686 -Wno-error=maybe-uninitialized"
                            -DCMAKE_CXX_FLAGS="-m32 -msse2 -mstackrealign -march=i686"
                            -DCMAKE_SHARED_LINKER_FLAGS="-m32"
                    
                    # Linux ARM64
                    -   target: linux-arm64
                        runs_on: ubuntu-latest
                        apt_packages: gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
                        cmake_flags: >
                            -DBUILD_SHARED_LIBS=ON
                            -DCMAKE_BUILD_TYPE=Release
                            -DBOX2D_SAMPLES=OFF
                            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=bin
                            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin
                            -DCMAKE_SYSTEM_NAME=Linux
                            -DCMAKE_SYSTEM_PROCESSOR=aarch64
                            -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
                            -DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++
                            -DCMAKE_C_FLAGS="-Wno-error=maybe-uninitialized" 

                    # Windows x64
                    -   target: win-x64
                        runs_on: windows-latest
                        vs_arch: x64
                        cmake_flags: >
                            -DBUILD_SHARED_LIBS=ON -DCMAKE_BUILD_TYPE=Release -DBOX2D_SAMPLES=OFF -DBOX2D_SANITIZE=ON -DBOX2D_VALIDATE=ON -DCMAKE_COMPILE_WARNING_AS_ERROR=ON -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=bin -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin
                             
                    # Windows x86
                    -   target: win-x86
                        runs_on: windows-latest
                        vs_arch: Win32
                        cmake_flags: >
                            -DBUILD_SHARED_LIBS=ON
                            -DCMAKE_BUILD_TYPE=Release
                            -DBOX2D_SAMPLES=OFF
                            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=bin
                            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin
                            -DCMAKE_EXE_LINKER_FLAGS="-m32"
                            -DCMAKE_MODULE_LINKER_FLAGS="-m32"
                            -DCMAKE_SHARED_LINKER_FLAGS="-m32"
                    
                    # Windows ARM64
                    -   target: win-arm64
                        runs_on: windows-latest
                        vs_arch: ARM64
                        cmake_flags: >
                            -DBUILD_SHARED_LIBS=ON
                            -DCMAKE_BUILD_TYPE=Release
                            -DBOX2D_SAMPLES=OFF
                            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=bin
                            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin

                    # macOS x64
                    -   target: osx-x64
                        runs_on: macos-15-intel
                        cmake_flags: >
                            -DBUILD_SHARED_LIBS=ON
                            -DCMAKE_BUILD_TYPE=Release
                            -DBOX2D_SAMPLES=OFF
                            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=bin
                            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin
                            -DCMAKE_OSX_ARCHITECTURES=x86_64

                    # macOS ARM64
                    -   target: osx-arm64
                        runs_on: macos-latest
                        cmake_flags: >
                            -DBUILD_SHARED_LIBS=ON
                            -DCMAKE_BUILD_TYPE=Release
                            -DBOX2D_SAMPLES=OFF
                            -DCMAKE_LIBRARY_OUTPUT_DIRECTORY=bin
                            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin
                            -DCMAKE_OSX_ARCHITECTURES=arm64
                            
        runs-on: ${{ matrix.runs_on }}
        
        concurrency:
            group: box2d-${{ matrix.target }}-${{ needs.detect-tag.outputs.box2d_ref }}
            cancel-in-progress: false

        steps:
            -   id: purge
                shell: bash
                run: |
                    rm -rf ./* 

            -   id: cache
                name: Restore native build cache
                uses: actions/cache@v4
                with:
                    path: box2d-build
                    key: ${{ matrix.target }}-${{ needs.detect-tag.outputs.box2d_ref }}
                    restore-keys: |
                        ${{ matrix.target }}-${{ needs.detect-tag.outputs.box2d_ref }}

            -   name: "Clone Box2D ${{ needs.detect-tag.outputs.box2d_ref }}"
                if: steps.cache.outputs.cache-hit != 'true'
                run: |
                    git clone https://github.com/${{ env.BOX2D_REPO }} box2d-src
                    cd box2d-src
                    git checkout ${{ needs.detect-tag.outputs.box2d_ref }}

            -   name: "Install Linux cross-build dependencies"
                if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
                shell: bash
                run: |
                    sudo apt-get update
                    sudo apt-get install -y ${{ matrix.apt_packages }}

            -   name: "Configure & compile Box2D on Linux"
                if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Linux'
                shell: bash
                run: |
                    cmake -S box2d-src -B box2d-build ${{ matrix.cmake_flags }}
                    cmake --build box2d-build --config Release --parallel
                    
            -   name: "Configure & compile Box2D on Windows"
                if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'Windows'
                shell: pwsh
                run: |
                    cmake -S box2d-src -B box2d-build `
                      -A "${{ matrix.vs_arch }}" `
                      ${{ matrix.cmake_flags }}
                    cmake --build box2d-build --config Release --parallel

            -   name: "Configure & compile Box2D on macOS"
                if: steps.cache.outputs.cache-hit != 'true' && runner.os == 'macOS'
                shell: bash
                run: |
                    cmake -S box2d-src -B box2d-build ${{ matrix.cmake_flags }}
                    cmake --build box2d-build --config Release --parallel

            - name: Prepare artefact directory
              shell: bash
              run: |
                  set -euo pipefail
                  mkdir -p artefact/
                  find box2d-build -maxdepth 4 -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.dll' \) -exec cp {} artefact/ \;
        
            - name: Fail if artefact directory is empty
              shell: bash
              run: |
                  if ! find artefact -maxdepth 1 -type f | grep -q .; then
                  echo "Artefact directory is empty, aborting."
                  find box2d-build -maxdepth 4 -type f
                  exit 1
                  fi

            -   name: Upload artefacts
                uses: actions/upload-artifact@v4
                with:
                    name: ${{ matrix.target }}
                    path: artefact/
                    retention-days: 7
                    if-no-files-found: 'error'
    
    run-tests:
        name: Test C# bindings
        needs: [ detect-tag, build-box2d-linux-x64 ]
        runs-on: ubuntu-latest
        steps:
            -   id: purge
                run: |
                    rm -rf ./* 

            -   uses: actions/checkout@v4

            -   name: "Download native libs"
                uses: actions/download-artifact@v4
                with:
                    path: src/Box2DBindings/native
                    pattern: "*"

            -   name: Build UnitTests project
                run: |
                    dotnet build src/UnitTests --configuration Debug --framework net8.0
                    dotnet build src/UnitTests --configuration Debug --framework net9.0
                    dotnet build src/UnitTests --configuration Debug --framework net10.0

            -   name: Copy Linux shared library to UnitTests output
                shell: bash
                run: |
                    set -e
                    lib=src/Box2DBindings/native/linux-x64/libbox2d.so
                    if [ ! -f "$lib" ]; then
                      echo "Missing Linux shared library: $lib"
                      exit 1
                    fi
                    cp "$lib" src/UnitTests/bin/Debug/net8.0/
                    cp "$lib" src/UnitTests/bin/Debug/net9.0/
                    cp "$lib" src/UnitTests/bin/Debug/net10.0/
                    
                    sync

            -   name: Run UnitTests (net8.0)
                run: dotnet test src/UnitTests --configuration Debug --framework net8.0 --no-build --logger trx --results-directory TestResults

            -   name: Run UnitTests (net9.0)
                run: dotnet test src/UnitTests --configuration Debug --framework net9.0 --no-build --logger trx --results-directory TestResults

            -   name: Run UnitTests (net10.0)
                run: dotnet test src/UnitTests --configuration Debug --framework net10.0 --no-build --logger trx --results-directory TestResults


